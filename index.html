<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarship Monitoring System</title><link rel="stylesheet" href="style.css"></head><body>
<section id="auth"><h1>Scholarship Monitoring</h1><p>Academic compliance tracking</p>
<input id="name" placeholder="Full name (sign up only)"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ chars)">
<div class="row"><button id="login">Log in</button><button id="signup" class="alt">Sign up</button></div><p id="authmsg" class="msg"></p></section>
<div id="app" hidden><header><b>Scholarship Monitoring</b><span id="who"></span><button id="logout" class="alt">Log out</button></header>
<nav id="tabs"></nav><main id="view"></main></div><p id="toast"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="app.js"></script></body></html>
