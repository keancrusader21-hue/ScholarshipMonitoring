<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarship Monitoring System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<section id="auth">
 <div class="pitch"><h1>Scholarship Monitoring</h1><p>Collect grades, verify submissions, and keep every scholar's compliance in view.</p></div>
 <div class="box"><h2>Log in or create an account</h2>
  <input id="name" placeholder="Full name (sign up only)"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ characters)">
  <div class="row"><button id="login">Log in</button><button id="signup" class="alt">Sign up</button></div><p id="authmsg" class="msg"></p></div>
</section>
<div id="app" hidden>
 <aside><div class="brand">Scholarship<br>Monitoring</div><nav id="tabs"></nav>
  <div class="me"><span id="who"></span><button id="logout" class="alt">Log out</button></div></aside>
 <main id="view"></main>
</div><p id="toast"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="app.js"></script>
<script>
const tone=t=>/^(Compliant|Renewed|Verified)/.test(t)?'ok':/^(With|Probation)/.test(t)?'warn':/^(Disqualified|Rejected)/.test(t)?'bad':'info';
new MutationObserver(()=>document.querySelectorAll('.tag:not([data-t])').forEach(e=>e.dataset.t=tone(e.textContent))).observe(document.getElementById('view'),{childList:true,subtree:true});
</script></body></html>
